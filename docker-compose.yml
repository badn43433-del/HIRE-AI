services:
  # Local PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: hireshield-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hireshield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service (OpenCV, MediaPipe, Whisper, Local Evaluator)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireshield-fastapi
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hireshield_db
      - FASTAPI_PORT=8000
      - FASTAPI_HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - JWT_SECRET=hireshield_local_jwt_secret_key_change_in_production_2026
      - AI_INFERENCE_DEVICE=cpu
    ports:
      - "8000:8000"

  # React Frontend Service (Vite + Tailwind)
  frontend:
    image: node:20-alpine
    container_name: hireshield-frontend
    restart: always
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev
    depends_on:
      - backend

volumes:
  pgdata:
